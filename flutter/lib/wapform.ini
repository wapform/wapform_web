; ============================================================
; WapForm for Flutter back office (wapform.ini)
; Required: the database settings. Everything else is optional.
; ============================================================

; ---- Database (required) ------------------------------------
Driver=mysql
Server=localhost
Database=sales
Username=xyz
Password=123

; ---- Optional ------------------------------------------------
; Unicode (UTF-8 / utf8mb4) connection; the line itself switches it on
unicode=yes
; Interface language: en, tw or jp (default en)
language=en
